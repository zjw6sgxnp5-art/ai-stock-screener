name: ai-stock-local

services:
  ai-stock:
    build:
      context: .
    image: ai-stock-local:local
    container_name: ai-stock-local
    environment:
      AI_STOCK_HOST: 0.0.0.0
      AI_STOCK_PORT: "8765"
      AI_STOCK_DB: /app/data/app.sqlite
      LONG_BRIDGE_BIN: longbridge
      LONG_BRIDGE_TIMEOUT: ${LONG_BRIDGE_TIMEOUT:-25}
      AI_STOCK_LLM_MODEL: ${AI_STOCK_LLM_MODEL:-gemini-1.5-pro}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      # 安全约束：仅监听宿主机本地回环 127.0.0.1，阻断局域网未授权访问
      - "127.0.0.1:${AI_STOCK_HOST_PORT:-8765}:8765"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      # 需可写：长桥 CLI 会自动刷新 OAuth token 写入 ~/.longbridge/openapi/tokens/（见 docs/SECURITY.md；不需要长桥可注释本行）
      - ${HOME}/.longbridge:/root/.longbridge
    restart: unless-stopped
